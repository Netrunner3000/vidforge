# vidforge — channel + render settings.
# Everything here can be overridden per-run with CLI flags (see `main.py run --help`).

channel:
  name: "Atlas & Archive"
  niche: >-
    geography, history, technology, travel, science and "how things work"
    explainers for a curious general audience
  language: "English"
  audience: "curious adults, 25-45, watching on a phone or TV"

script:
  provider: openai            # openai | anthropic
  openai_model: gpt-4o
  anthropic_model: claude-opus-5
  target_seconds: 480         # aim for an ~8 minute video
  scene_seconds: 14           # one visual per ~14s of narration
  words_per_minute: 155       # used to convert seconds -> word budget
  style: >-
    Documentary voice. Concrete, specific, factual. Short declarative
    sentences. Open with a hook that creates an open loop. No filler,
    no "in this video", no "welcome back", no calls to subscribe mid-body.

voice:
  model: gpt-4o-mini-tts
  voice: onyx                 # alloy | echo | fable | onyx | nova | shimmer | ash | sage | coral
  instructions: >-
    Warm, confident documentary narrator. Measured pace, clear diction,
    slight emphasis on numbers and names. Never rushed.
  scene_gap: 0.35             # seconds of silence after each scene

visuals:
  source: ai                  # ai | pexels | gradient
  image_model: gpt-image-1
  image_size: "1536x1024"
  image_quality: medium       # low | medium | high
  style_suffix: >-
    cinematic photograph, natural lighting, rich detail, 35mm, shallow depth
    of field, no text, no watermark, no logos, no people looking at camera
  pexels_orientation: landscape

video:
  width: 1920
  height: 1080
  fps: 30
  supersample: 2              # render Ken Burns at NxN then downscale (kills jitter)
  kenburns: true
  transition: xfade           # xfade | cut
  transition_seconds: 0.6
  crf: 20
  preset: medium

captions:
  enabled: true
  # auto picks `ass` when your ffmpeg has libass, else `overlay` (Pillow-drawn
  # PNGs composited with the overlay filter — works on any ffmpeg build).
  renderer: auto              # auto | ass | overlay
  align: whisper              # whisper (accurate, costs a little) | estimate (free)
  words_per_cue: 3
  font: "Arial"
  font_size: 84
  karaoke: true               # highlight the word currently being spoken

music:
  enabled: true
  volume: 0.13
  duck: true                  # sidechain-compress music under the narration

audio:
  # YouTube turns loud audio down to about -14 LUFS but never turns quiet audio
  # up, so an un-normalised upload just sounds quieter than everything else.
  normalize: true
  loudness_lufs: -14.0
  true_peak_db: -1.5

thumbnail:
  enabled: true

trends:
  # The Scanner reads the public trending chart. It needs a plain Google Cloud
  # API key in YOUTUBE_API_KEY — NOT the OAuth client used for uploading.
  region: US                  # ISO 3166-1 alpha-2: US, GB, DE, JP…
  limit: 50                   # max 200; the chart will not paginate further
  cluster: true               # group the videos into topic veins with the LLM
  max_clusters: 8
  cache_hours: 6              # reuse a scan this old before spending quota again

youtube:
  enabled: false              # must be true AND --publish passed to upload
  privacy: private            # private | unlisted | public
  category_id: "27"           # 27 = Education, 28 = Science & Tech, 19 = Travel
  made_for_kids: false
